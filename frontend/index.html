<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineManager | Catálogo de Filmes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="cabecalho">
    <div class="cabecalho-conteudo">
        <h1>🎬 Enciclopédia de Filmes</h1>
        <p>Gerenciamento de Catálogo Cinematográfico • API REST Java</p>
    </div>
</header>

<main class="container">
    <!-- Banner de feedback visual para operações HTTP (Sucesso / Erro) -->
    <div id="feedback" class="feedback oculto" role="alert"></div>

    <div class="grid-principal">
        <!-- CARD 1: Formulário de Cadastro (POST) e Edição (PUT) -->
        <section class="card">
            <div class="card-header">
                <h2 id="form-titulo">Cadastrar Novo Filme</h2>
                <span id="badge-modo" class="badge badge-cadastro">Novo Registro</span>
            </div>

            <form id="form-cinema">
                <!-- Armazena o ID oculto quando o formulário entra em modo de edição (PUT) -->
                <input type="hidden" id="filme-id">

                <div class="grupo-campo">
                    <label for="nome">Título do Filme *</label>
                    <input type="text" id="nome" placeholder="Ex: Interestelar" required>
                </div>

                <div class="grupo-campo">
                    <label for="genero">Gênero *</label>
                    <input type="text" id="genero" placeholder="Ex: Ficção Científica" required>
                </div>

                <div class="linha-dupla">
                    <div class="grupo-campo">
                        <label for="anoLancamento">Ano de Lançamento *</label>
                        <input type="number" id="anoLancamento" placeholder="Ex: 2014" min="1888" max="2100" required>
                    </div>

                    <div class="grupo-campo">
                        <label for="nota">Nota (0 a 10) *</label>
                        <input type="number" id="nota" placeholder="Ex: 9.5" step="0.1" min="0" max="10" required>
                    </div>
                </div>

                <div class="grupo-campo">
                    <label for="bilheteria">Bilheteria (R$) *</label>
                    <input type="number" id="bilheteria" placeholder="Ex: 701700000.00" step="0.01" min="0" required>
                </div>

                <div class="acoes-form">
                    <button type="submit" id="btn-submit" class="btn btn-primario">Salvar Filme</button>
                    <button type="button" id="btn-cancelar" class="btn btn-secundario oculto">Cancelar</button>
                </div>
            </form>
        </section>

        <!-- CARD 2: Consulta (GET) e Ações sobre o Registro (Editar / Excluir - DELETE) -->
        <section class="card">
            <div class="card-header">
                <h2>Consultar Filme</h2>
                <span class="badge badge-consulta">Busca por Nome</span>
            </div>

            <form id="form-busca" class="barra-busca">
                <input type="text" id="campo-busca" placeholder="Digite o nome exato do filme..." required>
                <button type="submit" class="btn btn-primario">Buscar</button>
            </form>

            <!-- Área onde o card do filme retornado pelo GET será injetado -->
            <div id="area-resultado" class="area-resultado">
                <div class="estado-vazio">
                    <span>🍿</span>
                    <p>Pesquise pelo título de um filme cadastrado para visualizar seus detalhes, editar ou excluir.</p>
                </div>
            </div>
        </section>
    </div>
</main>

<script src="script.js"></script>
</body>
</html>
